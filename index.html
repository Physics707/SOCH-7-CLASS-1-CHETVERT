  <script type="module">
import { createHotContext } from "/physics-q1-test/@vite/client";
const hot = createHotContext("/__dummy__runtime-error-plugin");

function sendError(error) {
  if (!(error instanceof Error)) {
    error = new Error("(unknown runtime error)");
  }
  const serialized = {
    message: error.message,
    stack: error.stack,
  };
  hot.send("runtime-error-plugin:error", serialized);
}

// Only notify the parent frame after the server confirms the error passed
// the filter and the overlay will be shown.
hot.on("runtime-error-plugin:notify-parent", () => {
  try {
    window.parent.postMessage({ type: "runtime-error", id: null }, "*");
  } catch (_) {}
});

window.addEventListener("error", (evt) => {
  sendError(evt.error);
});

window.addEventListener("unhandledrejection", (evt) => {
  sendError(evt.reason);
});
</script>

        formulas({id:"v2-f1",prompt:"Выберите формулу времени равномерного движения."},["t = s · v","t = s / v","t = v / s","t = s + v"],1),

        formulas({id:"v2-f3",prompt:"Какая запись выражает путь при постоянной скорости?"},["s = v · t","s = t − v","s = v / t","s = v + t"],0),
        formulas({id:"v2-f4",prompt:"Как найти среднюю скорость, если известны полный путь и полное время?"},["vср = sобщ / tобщ","vср = tобщ / sобщ","vср = sобщ · tобщ","vср = s₁ / tобщ"],0),
        graph({id:"v2-g1",prompt:"Какой путь прошло тело за 2 секунды?",svg:graphs.lineF},["4 м","8 м","12 м","16 м"],1),
        graph({id:"v2-g2",prompt:"В каком направлении движется тело согласно графику координаты?",svg:graphs.lineG},["В положительном направлении","В отрицательном направлении","Тело покоится","Направление определить нельзя"],1),

        numeric({id:"v2-n10",prompt:"За 8 с координата выросла с −10 м до 14 м. Найдите проекцию скорости, м/с.",answer:3}),

        qualitative({id:"v2-q1",prompt:"Назовите три основные единицы СИ для массы, длины и времени (можно в любом порядке).",keys:["килограмм|кг","метр|м","секунда|с","масса","длина"]}),
        qualitative({id:"v2-q2",prompt:"Назовите три характеристики, которыми можно описать вектор силы.",keys:["модуль","направление","точка приложения","линия действия","стрелка"]}),

    function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function renderStart(){
      state.screen="start";
      app.innerHTML=`<section class="fade-in"><p class="eyebrow">Суммативная работа · 1 четверть</p><h1 class="title">СОЧ по физике за <br><em>1 четверть 7 класс </em></h1><p class="intro">Читайте внимательно задания и выполняйте самостоятельно. Успехов.</p><div class="rule"></div><form id="startForm"><div class="metadata"><div class="field full"><label for="student">Фамилия и имя ученика</label><input id="student" name="student" type="text" autocomplete="name" maxlength="100" placeholder="Введите ФИ" required data-testid="input-student-name"></div><div class="field"><label for="className">Класс</label><select id="className" name="className" data-testid="select-class"><option>7 «Б»</option><option>7 «В»</option></select></div><div class="field"><label for="variant">Вариант</label><select id="variant" name="variant" data-testid="select-variant"><option value="1">Вариант 1</option><option value="2">Вариант 2</option></select></div></div><div class="teacher-card"><div class="teacher-label">Учитель физики</div><div class="teacher-name">${teacher}</div></div><ul class="feature-list"><li>30 заданий, каждое оценивается в 1 балл</li><li>На выполнение каждого задания даётся от 60 до 90 секунд</li><li>Для кратких ответов требуется вписать ключевые понятия своими словами</li></ul><button class="btn full" type="submit" data-testid="button-start">Продолжить к правилам <span aria-hidden="true">→</span></button></form></section>`;
      
      document.getElementById("startForm").addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(e.currentTarget);state.studentName=String(fd.get("student")).trim();state.className=String(fd.get("className"));state.variant=String(fd.get("variant"));if(state.studentName)renderDisclaimer();});
    }
    function renderDisclaimer(){
      state.screen="disclaimer";
      app.innerHTML=`<section class="fade-in"><p class="eyebrow">Перед началом · ${escapeHTML(state.className)} · Вариант ${state.variant}</p><h1 class="title">Сначала —<br><em>правила работы.</em></h1><div class="notice"><strong>Когда вы нажмёте «Начать тест», начнётся отсчёт времени и будет учтена попытка.</strong>Прочитайте условия до старта. После начала вернуться к предыдущему вопросу нельзя.</div><ul class="feature-list"><li>Всего 30 заданий и 30 возможных баллов. Один правильный ответ даёт 1 балл.</li><li>В заданиях с выбором отметьте один вариант. В расчётных заданиях введите только число, без единиц измерения.</li><li>В кратком ответе укажите своими словами основные понятия. Правильность ответов во время работы не показывается.</li><li>На вопрос с выбором отводится 60 секунд, на числовой или краткий ответ — 90 секунд. По истечении времени работа продолжится автоматически.</li><li>Не переключайтесь на другие приложения или вкладки. При уходе со страницы попытка будет завершена.</li></ul><p class="small-note">Для справедливого оценивания выполняйте работу самостоятельно и не закрывайте эту страницу. Технические ограничения браузера не могут гарантировать защиту от всех способов изменения устройства или браузера.</p><div class="rule"></div><button class="btn full" id="beginTest" data-testid="button-begin-test">Согласен, начать тест <span aria-hidden="true">→</span></button><button class="btn secondary full" style="margin-top:10px" id="returnStart" data-testid="button-edit-details">Вернуться к данным</button></section>`;
      document.getElementById("beginTest").addEventListener("click",beginTest);
      document.getElementById("returnStart").addEventListener("click",renderStart);
    }
    function attemptKey(){return "physicsq1_attempts:"+[state.studentName.toLocaleLowerCase("ru-RU").replace(/\s+/g," ").trim(),state.className,state.variant].join("|");}
    function beginTest(){
      state.questions=(state.variant==="1"?buildVariant1():buildVariant2());
      state.answers=Array(30).fill(null);state.index=0;state.warningCount=0;state.score=0;state.startedAt=Date.now();
      const key=attemptKey();state.attempt=(Number(localStorage.getItem(key))||0)+1;localStorage.setItem(key,String(state.attempt));
      state.baselineHeight=window.innerHeight;state.screen="test";
      renderQuestion();installAntiCheat();
    }
    function currentAnswer(){return state.answers[state.index];}
    function renderQuestion(){
      clearInterval(state.timer);const q=state.questions[state.index];state.remaining=q.limit;
      const progress=(state.index/30)*100;
      const answer=currentAnswer();
      let body="";
      if(q.svg)body+=`<div class="graph-wrap">${q.svg}</div>`;
      if(q.kind==="choice"){body+=`<div class="answers" role="group" aria-label="Варианты ответа">${q.options.map((o,i)=>`<button type="button" class="answer ${answer===i?"selected":""}" aria-pressed="${answer===i}" data-choice="${i}" data-testid="answer-${q.id}-${i}"><span class="answer-key">${String.fromCharCode(А_CODE+i)}</span><span>${escapeHTML(o)}</span></button>`).join("")}</div>`}
      else{body+=`<label class="field-label" for="answerInput">${q.kind==="number"?"Числовой ответ":"Ваш краткий ответ"}</label><input class="response-input" id="answerInput" type="text" ${q.kind==="number"?'inputmode="decimal" autocomplete="off"':'autocomplete="off"'} maxlength="240" placeholder="${q.kind==="number"?"Введите число":"Напишите ответ своими словами"}" value="${escapeHTML(answer||"")}" aria-describedby="answerHint" data-testid="input-answer"><div class="input-hint" id="answerHint">${q.kind==="number"?"Введите только число, без единицы измерения. Десятичную дробь можно записать через запятую или точку.":"Краткий ответ оценивается автоматически по ключевым понятиям. Формулируйте ответ самостоятельно."}</div>`}
      app.innerHTML=`<section class="fade-in"><div class="exam-head"><div><div class="exam-heading">Вариант ${state.variant} · ${escapeHTML(state.className)}</div><div class="count">Задание ${state.index+1}<span style="color:#748681"> / 30</span></div></div><div class="timer-wrap"><div class="timer" id="timerRing" role="timer" aria-label="Осталось ${state.remaining} секунд" style="--pct:100%"><span id="timerText">${state.remaining}</span></div><div class="time-label">СЕКУНД<br>ОСТАЛОСЬ</div></div><div class="progress-track" role="progressbar" aria-label="Прогресс теста" aria-valuemin="0" aria-valuemax="30" aria-valuenow="${state.index}"><div class="progress-fill" style="width:${progress}%"></div></div></div><div class="q-type">${escapeHTML(q.type)} · 1 балл</div><h1 class="q-title">${escapeHTML(q.prompt)}</h1>${q.context?`<p class="q-context">${escapeHTML(q.context)}</p>`:""}${body}<div class="q-footer"><span class="points">ОТВЕТ НЕ ПОКАЗЫВАЕТСЯ</span><button class="btn question-nav" id="nextQuestion" ${answer===null||answer===""?"disabled":""} data-testid="button-next">Далее <span aria-hidden="true">→</span></button></div></section>`;
      if(q.kind==="choice"){
        app.querySelectorAll("[data-choice]").forEach(btn=>btn.addEventListener("click",()=>{state.answers[state.index]=Number(btn.dataset.choice);app.querySelectorAll(".answer").forEach(x=>{const selected=x===btn;x.classList.toggle("selected",selected);x.setAttribute("aria-pressed",String(selected));});document.getElementById("nextQuestion").disabled=false;}));
      }else{
        const input=document.getElementById("answerInput");input.addEventListener("input",()=>{state.answers[state.index]=input.value;document.getElementById("nextQuestion").disabled=!input.value.trim();});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&input.value.trim()){e.preventDefault();advance();}});
      }
      document.getElementById("nextQuestion").addEventListener("click",advance);
      state.timer=setInterval(tick,1000);
    }
    const А_CODE=0x410;
    function tick(){state.remaining--;const text=document.getElementById("timerText"),ring=document.getElementById("timerRing"),q=state.questions[state.index];if(!text||!ring)return;text.textContent=String(state.remaining);ring.style.setProperty("--pct",`${Math.max(0,state.remaining/q.limit*100)}%`);ring.setAttribute("aria-label",`Осталось ${state.remaining} секунд`);if(state.remaining<=10)ring.style.background=`conic-gradient(#f4c87a ${Math.max(0,state.remaining/q.limit*100)}%,#34434a 0)`;if(state.remaining<=0)advance();}
    function advance(){if(state.screen!=="test")return;const ans=state.answers[state.index];if(ans!==null&&ans!==undefined&&String(ans).trim()!==""){}else state.answers[state.index]=null;if(state.index>=29){finish("completed");return;}state.index++;renderQuestion();}
    function answerCorrect(q,a){
      if(a===null||a===undefined||String(a).trim()==="")return false;
      if(q.kind==="choice")return Number(a)===q.answer;
      if(q.kind==="number"){const val=Number(String(a).replace(",",".").trim());return Number.isFinite(val)&&Math.abs(val-q.answer)<=q.tolerance;}
      const text=` ${normalizeKeywordText(a)} `;
      const groups=q.keys.map(k=>(Array.isArray(k)?k:String(k).split("|")).map(normalizeKeywordText).filter(Boolean).sort((a,b)=>b.length-a.length));
      const spans=[];
      for(const alternatives of groups){
        let matched=false;
        for(const keyword of alternatives){
          const needle=` ${keyword} `;let from=0;
          while(true){
            const at=text.indexOf(needle,from);if(at<0)break;
            const start=at+1,end=start+keyword.length;
            if(!spans.some(span=>start<span.end&&end>span.start)){spans.push({start,end});matched=true;break;}
            from=at+1;
          }
          if(matched)break;
        }
      }
      return spans.length>=3;
    }
    function normalizeKeywordText(value){return String(value).toLocaleLowerCase("ru-RU").replace(/ё/g,"е").replace(/[^\p{L}\p{N}]+/gu," ").trim().replace(/\s+/g," ");}
    function finish(reason){
      if(state.screen!=="test")return;clearInterval(state.timer);state.finishReason=reason;state.score=state.questions.reduce((total,q,i)=>total+(answerCorrect(q,state.answers[i])?1:0),0);state.screen="result";removeAntiCheat();renderResult();sendResult();
    }
    function renderResult(){
      const reason=state.finishReason==="completed"?"Тест завершён":"Завершено из-за переключения";
      app.innerHTML=`<section class="fade-in"><p class="eyebrow">Результат · ${escapeHTML(state.className)} · Вариант ${state.variant}</p><h1 class="title">Работа<br><em>завершена.</em></h1><div class="result-score">${state.score}<span class="result-unit"> / 30 баллов</span></div><div class="rule"></div><div class="result-grid"><div class="result-item"><label>Ученик</label><strong>${escapeHTML(state.studentName)}</strong></div><div class="result-item"><label>Класс и вариант</label><strong>${escapeHTML(state.className)} · ${state.variant}</strong></div><div class="result-item"><label>Использованная попытка</label><strong>${state.attempt}</strong></div><div class="result-item"><label>Причина завершения</label><strong>${reason}</strong></div></div><div class="result-status" id="sendStatus" role="status" aria-live="polite">${state.savingStatus}</div><p class="small-note">Результат содержит только итоговые баллы и сведения о попытке. Правильные ответы не раскрываются.</p><div class="result-actions"><button class="btn full" id="again" data-testid="button-new-attempt">На главную</button><button class="btn secondary full hidden" id="teacherGuide" type="button" data-testid="button-teacher-guide">Инструкция для учителя</button></div><p class="small-note" style="margin-top:14px">Попытки считаются отдельно для сочетания ФИ, класса и варианта в этом браузере.</p></section>`;
      document.getElementById("again").addEventListener("click",renderStart);
       // Show the teacher guide action only when the published file is available.
      fetch("./GOOGLE-SHEETS.md",{method:"HEAD"}).then(r=>{if(r.ok){const b=document.getElementById("teacherGuide");b.classList.remove("hidden");b.addEventListener("click",()=>window.open("./GOOGLE-SHEETS.md","_blank","noopener"));}}).catch(()=>{});
    }


          async function sendResult(){
      const url=APPS_SCRIPT_URL.trim();
      if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/i.test(url)){
        state.savingStatus="Проверьте URL: нужен опубликованный адрес Apps Script, оканчивающийся на /exec.";
        updateStatus();
        return;
      }
      state.savingStatus="Сохраняется…";
      updateStatus();

      // Тексты ответов ученика
      const formattedAnswers = state.questions.map((q, i) => {
        const ans = state.answers[i];
        if (ans === null || ans === undefined || String(ans).trim() === "") return "Пропущено";
        if (q.kind === "choice") return q.options[ans];
        return String(ans);
      });

      // Статусы ответов: correct / wrong / empty
      const answerStatuses = state.questions.map((q, i) => {
        const ans = state.answers[i];
        const isEmpty = ans === null || ans === undefined || String(ans).trim() === "";
        if (isEmpty) return "empty";
        return answerCorrect(q, ans) ? "correct" : "wrong";
      });

      const payload={
        studentName:state.studentName,
        className:state.className,
        variant:Number(state.variant),
        attempt:state.attempt,
        score:state.score,
        totalScore:30,
        completedAt:new Date().toISOString(),
        finishReason:state.finishReason==="completed"?"completed":"anticheat",
        answers: formattedAnswers,
        statuses: answerStatuses
      };

      try{
        await fetch(url,{
          method:"POST",
          mode:"no-cors",
          headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify(payload)
        });
        state.savingStatus="Отправлено браузером. Ответ недоступен из-за ограничений междоменного доступа: подтвердить запись в таблице с этой страницы невозможно.";
        updateStatus();
      } catch{
        state.savingStatus="Не удалось отправить. Проверьте URL публикации и подключение к интернету.";
        updateStatus();
      }
    }


    function updateStatus(){const el=document.getElementById("sendStatus");if(el)el.textContent=state.savingStatus;}
    let antiInstalled=false,antiListeners=[];
    function installAntiCheat(){
      antiInstalled=true;const visibility=()=>{if(document.visibilityState==="hidden"&&state.screen==="test")finish("anticheat");};document.addEventListener("visibilitychange",visibility);antiListeners.push(()=>document.removeEventListener("visibilitychange",visibility));
      let lastHeight=window.innerHeight,lastWidth=window.innerWidth,keyboardWasOpen=false;let resizeTimer;
      const changed=()=>{if(state.screen!=="test")return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.screen!=="test")return;const active=document.activeElement;const inputFocused=active&&(active.tagName==="INPUT"||active.tagName==="TEXTAREA");const viewport=window.visualViewport;const h=window.innerHeight,w=window.innerWidth;const keyboardOpen=inputFocused||(viewport&&h-viewport.height>150);if(keyboardOpen){keyboardWasOpen=true;lastHeight=h;lastWidth=w;return;}const deltaH=Math.abs(h-lastHeight),deltaW=Math.abs(w-lastWidth);lastHeight=h;lastWidth=w;if(keyboardWasOpen){keyboardWasOpen=false;return;}const heightThreshold=Math.max(160,Math.min(h,lastHeight)*0.22),widthThreshold=Math.max(120,Math.min(w,lastWidth)*0.28);if((deltaH<heightThreshold&&deltaW<widthThreshold)||(deltaH>220&&deltaW>220)||document.visibilityState!=="visible")return;showSwitchWarning();},220);};
      window.addEventListener("resize",changed,{passive:true});antiListeners.push(()=>window.removeEventListener("resize",changed));
      if(window.visualViewport){window.visualViewport.addEventListener("resize",changed,{passive:true});antiListeners.push(()=>window.visualViewport.removeEventListener("resize",changed));}
    }
    function removeAntiCheat(){antiListeners.forEach(fn=>fn());antiListeners=[];antiInstalled=false;}
    function showSwitchWarning(){
      if(state.screen!=="test"||document.getElementById("switchWarning"))return;
      state.warningCount++;
      if(state.warningCount>=2){finish("anticheat");return;}
      clearInterval(state.timer);
      const layer=document.createElement("div");layer.className="warning-screen";layer.id="switchWarning";layer.innerHTML=`<section class="warning-card" role="alertdialog" aria-modal="true" aria-labelledby="warnTitle" aria-describedby="warnDesc"><p class="eyebrow">Важное предупреждение</p><h2 id="warnTitle">Оставайтесь на странице теста</h2><p id="warnDesc">Обнаружено заметное изменение размера окна. Вернитесь к работе и не переключайтесь на другие приложения или вкладки. При повторном срабатывании попытка завершится.</p><button class="btn full" id="warningOk">Понятно, продолжить</button></section>`;
      document.body.appendChild(layer);document.getElementById("warningOk").addEventListener("click",()=>{layer.remove();if(state.screen==="test")state.timer=setInterval(tick,1000);});
      document.getElementById("warningOk").focus();
    }
    renderStart();
  })();
  </script>
